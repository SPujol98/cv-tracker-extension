name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Type check
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Layer boundaries
        run: pnpm depcruise
      - name: Telemetry dependencies
        run: pnpm check:deps
      - name: Repository policy
        run: pnpm check:repo-policy --all
      - name: Secret scan
        run: pnpm secretlint
      - name: Dependency audit
        run: pnpm audit --prod --audit-level high
      - name: Unit and integration tests with coverage
        run: pnpm test --coverage
      - name: Build
        run: pnpm build
      - name: Build tests
        run: pnpm vitest run tests/build
      - name: Install the Playwright browser
        run: pnpm exec playwright install --with-deps chromium
      # Headless Chromium (channel: chromium, new headless mode) loads extensions; no xvfb needed.
      - name: End-to-end smoke
        run: pnpm e2e
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
